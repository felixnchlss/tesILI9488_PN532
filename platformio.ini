[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200

lib_deps = 
  bodmer/TFT_eSPI@^2.5.43
  adafruit/Adafruit PN532 @ ^1.3.3
  adafruit/Adafruit BusIO @ ^1.16.1
  Wire

build_flags =
  -D USER_SETUP_LOADED=1
  -D ILI9488_DRIVER=1
  -D TFT_MISO=19
  -D TFT_MOSI=23
  -D TFT_SCLK=18
  -D TFT_CS=15
  -D TFT_DC=2      ; BERUBAH: Pindah dari 22 ke 2 agar pin 22 bisa dipakai I2C (SCL)
  -D TFT_RST=4
  -D LOAD_GLCD=1  
  -D LOAD_FONT2=1 
  -D LOAD_FONT4=1  
  -D SPI_FREQUENCY=27000000